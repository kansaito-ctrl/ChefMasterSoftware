<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4eee5">
    <title>Chefmaster | Acceso</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #211e1a;
            --muted: #62584c;
            --paper: #f7e9c7;
            --accent: #c83b2b;
            --yellow: #f4c84a;
            --line: #211e1a;
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(#c7a96d 1px, transparent 1px);
            background-size: 13px 13px;
        }

        main {
            width: min(100%, 470px);
            padding: clamp(28px, 7vw, 54px);
            background: #fff9e9;
            border: 4px solid var(--ink);
            border-radius: 9px 6px 10px 7px;
            box-shadow: 8px 9px 0 var(--ink);
            animation: appear 420ms ease-out both;
        }

        .brand-mark {
            display: inline-block;
            margin: 0 0 28px;
            padding: 8px 14px;
            border: 3px solid var(--ink);
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 3px 3px 0 var(--ink);
            color: #fff9e9;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            transform: rotate(-4deg);
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 10vw, 54px);
            font-weight: 900;
            line-height: 0.98;
            text-shadow: 2px 2px 0 var(--yellow);
        }

        .intro {
            margin: 14px 0 32px;
            color: var(--muted);
            font-weight: 600;
            line-height: 1.5;
        }

        .choices { display: grid; gap: 12px; }

        button {
            width: 100%;
            min-height: 58px;
            padding: 12px 16px;
            border: 3px solid var(--ink);
            border-radius: 13px 9px 12px 8px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--ink);
            transition: background-color 150ms ease, color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }

        button:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 6px 7px 0 var(--ink); }
        button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

        button:focus-visible, input:focus-visible {
            outline: 3px solid #d67b50;
            outline-offset: 3px;
        }

        .client-button { background: var(--accent); color: #fff9e9; }
        .client-button:hover { background: #a92e22; }
        .admin-button { background: var(--yellow); }
        .admin-button:hover { background: #f8d86f; }
        .kitchen-button { background: #9ad1b0; }
        .kitchen-button:hover { background: #b2dfc4; }

        .arrow { float: right; font-size: 20px; line-height: 1; }

        #admin-panel {
            margin-top: 22px;
            padding-top: 22px;
            border-top: 3px dashed var(--line);
        }

        #admin-panel[hidden] { display: none; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            margin-bottom: 12px;
            padding: 10px 12px;
            border: 3px solid var(--ink);
            border-radius: 8px 5px 8px 5px;
            background: #fffdf7;
            color: var(--ink);
            font: inherit;
        }

        .submit-button { background: var(--ink); color: #fff9e9; }
        .submit-button:hover { background: #423b31; }

        #login-message {
            min-height: 20px;
            margin: 10px 0 0;
            color: #a52d22;
            font-size: 14px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <p class="brand-mark">Chefmaster</p>
        <h1>Bienvenido</h1>
        <p class="intro">Elige el tipo de acceso para continuar.</p>

        <div class="choices">
            <button class="client-button" id="client-button" type="button">
                Entrar como cliente <span class="arrow" aria-hidden="true">&rarr;</span>
            </button>
            <button class="kitchen-button" id="kitchen-button" type="button" aria-expanded="false" aria-controls="admin-panel">
                Cocina <span class="arrow" aria-hidden="true">&rarr;</span>
            </button>
            <button class="admin-button" id="admin-button" type="button" aria-expanded="false" aria-controls="admin-panel">
                Administración <span class="arrow" aria-hidden="true">&rarr;</span>
            </button>
        </div>

        <form id="admin-panel" hidden>
            <label for="admin-password" id="password-label">Contraseña de administración</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
            <button class="submit-button" type="submit">Acceder <span class="arrow" aria-hidden="true">&rarr;</span></button>
            <p id="login-message" role="alert" aria-live="polite"></p>
        </form>
    </main>

    <script>
        const CLIENT_URL = "cliente.html";
        const DESTINOS = { admin: "administracion.html", cocina: "cocina.html" };
        const ETIQUETAS = { admin: "Contraseña de administración", cocina: "Contraseña de cocina" };
        let rolActual = "admin";

        const adminButton = document.querySelector("#admin-button");
        const kitchenButton = document.querySelector("#kitchen-button");
        const adminPanel = document.querySelector("#admin-panel");
        const passwordInput = document.querySelector("#admin-password");
        const passwordLabel = document.querySelector("#password-label");
        const loginMessage = document.querySelector("#login-message");

        document.querySelector("#client-button").addEventListener("click", () => {
            window.location.href = CLIENT_URL;
        });

        function elegir(rol) {
            const mismo = !adminPanel.hidden && rolActual === rol;
            rolActual = rol;
            adminPanel.hidden = mismo;
            passwordLabel.textContent = ETIQUETAS[rol];
            passwordInput.value = "";
            loginMessage.textContent = "";
            adminButton.setAttribute("aria-expanded", String(!adminPanel.hidden && rol === "admin"));
            kitchenButton.setAttribute("aria-expanded", String(!adminPanel.hidden && rol === "cocina"));
            if (!adminPanel.hidden) passwordInput.focus();
        }
        adminButton.addEventListener("click", () => elegir("admin"));
        kitchenButton.addEventListener("click", () => elegir("cocina"));

        // La contraseña se valida en el servidor, nunca en el navegador
        adminPanel.addEventListener("submit", async (event) => {
            event.preventDefault();
            loginMessage.textContent = "";

            try {
                const r = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ role: rolActual, password: passwordInput.value })
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(d.error || "Error del servidor");

                sessionStorage.setItem("token", d.token);
                sessionStorage.setItem("role", d.role);
                window.location.href = DESTINOS[d.role];
            } catch (err) {
                loginMessage.textContent = err.message;
                passwordInput.select();
            }
        });
    </script>
</body>
</html>
