<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4eee5">
    <title>Chefmaster | Cliente</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #211e1a;
            --muted: #62584c;
            --paper: #f7e9c7;
            --accent: #c83b2b;
            --yellow: #f4c84a;
            --line: #211e1a;
            font-family: "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background-color: var(--paper);
            background-image: radial-gradient(#c7a96d 1px, transparent 1px);
            background-size: 13px 13px;
        }

        main {
            width: min(100%, 470px);
            padding: clamp(28px, 7vw, 54px);
            background: #fff9e9;
            border: 4px solid var(--ink);
            border-radius: 9px 6px 10px 7px;
            box-shadow: 8px 9px 0 var(--ink);
            animation: appear 420ms ease-out both;
        }

        .brand-mark {
            display: inline-block;
            margin: 0 0 28px;
            padding: 8px 14px;
            border: 3px solid var(--ink);
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 3px 3px 0 var(--ink);
            color: #fff9e9;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            transform: rotate(-4deg);
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 10vw, 54px);
            font-weight: 900;
            line-height: 0.98;
            text-shadow: 2px 2px 0 var(--yellow);
        }

        .intro {
            margin: 14px 0 32px;
            color: var(--muted);
            font-weight: 600;
            line-height: 1.5;
        }

        .choices { display: grid; gap: 12px; }

        button {
            width: 100%;
            min-height: 58px;
            padding: 12px 16px;
            border: 3px solid var(--ink);
            border-radius: 13px 9px 12px 8px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--ink);
            transition: background-color 150ms ease, color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }

        button:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 6px 7px 0 var(--ink); }
        button:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

        button:focus-visible, input:focus-visible {
            outline: 3px solid #d67b50;
            outline-offset: 3px;
        }

        .client-button { background: var(--accent); color: #fff9e9; }
        .client-button:hover { background: #a92e22; }
        .admin-button { background: var(--yellow); }
        .admin-button:hover { background: #f8d86f; }

        .arrow { float: right; font-size: 20px; line-height: 1; }

        #admin-panel {
            margin-top: 22px;
            padding-top: 22px;
            border-top: 3px dashed var(--line);
        }

        #admin-panel[hidden] { display: none; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            min-height: 48px;
            margin-bottom: 12px;
            padding: 10px 12px;
            border: 3px solid var(--ink);
            border-radius: 8px 5px 8px 5px;
            background: #fffdf7;
            color: var(--ink);
            font: inherit;
        }

        .submit-button { background: var(--ink); color: #fff9e9; }
        .submit-button:hover { background: #423b31; }

        #login-message {
            min-height: 20px;
            margin: 10px 0 0;
            color: #a52d22;
            font-size: 14px;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <p class="brand-mark">Chefmaster</p>
        <h1>Próximamente</h1>
        <p class="intro">La página para clientes está en construcción.</p>
        <div class="choices">
            <button class="admin-button" type="button" onclick="window.location.href='index.html'">
                Volver al inicio <span class="arrow" aria-hidden="true">&larr;</span>
            </button>
        </div>
    </main>
</body>
</html>
